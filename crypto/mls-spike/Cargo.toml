[package]
name = "squadtime-mls-spike"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
mls-rs = "=0.56.0"
mls-rs-core = "=0.27.0"
mls-rs-crypto-awslc = "=0.25.1"

zeroize = { version = "=1.9.1", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
base64ct = { version = "=1.8.3", features = ["alloc"] }
