openapi: 3.1.0
info:
  title: Squadtime DEV Relay API
  version: 1.0.0
  description: |
    Vertrag des Entwicklungs-Relays für synthetische Testclients. Keine öffentliche
    Provisionierung und kein produktives Endnutzer-Onboarding. Das Relay speichert
    opake Nutzdaten; es prüft weder MLS noch, ob ein Client den Inhalt tatsächlich
    verschlüsselt hat. Clients müssen diese Verschlüsselung korrekt umsetzen.
servers:
  - url: https://relay.example.invalid
    description: Platzhalter für die jeweilige DEV-Umgebung
security: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Öffentlicher Bereitschaftsstatus
      security: []
      responses:
        '200':
          description: Relay ist erreichbar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                service: squadtime-relay
                status: ok
                stage: dev
                protocolVersion: 1
  /v1/groups/{groupId}/events:
    parameters:
      - name: groupId
        in: path
        required: true
        description: Opaque Gruppenkennung; keine Klartextdaten.
        schema:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    get:
      operationId: listGroupEvents
      summary: Ereignisse einer Gruppe abrufen
      description: |
        Gibt höchstens 100 Ereignisse pro Seite zurück. `after` ist ein exklusiver
        Cursor über die serverseitige Reihenfolge. Abgelaufene Historie kann einen
        Resync erfordern. Ereignisse sind maximal sieben Tage über die API abrufbar.
        Die stündliche Bereinigung entfernt bis zu 1.000 abgelaufene Datensätze pro
        Lauf; Provider-Backups können länger bestehen.
      security:
        - DevBearer: []
      parameters:
        - name: after
          in: query
          required: false
          description: Exklusiver Cursor, sichere Ganzzahl ab 0; Standardwert 0.
          schema:
            type: integer
            minimum: 0
            maximum: 9007199254740991
            default: 0
      responses:
        '200':
          description: Ereignisseite.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '410':
          $ref: '#/components/responses/ResyncRequired'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: appendGroupEvent
      summary: Ein Gruppenereignis anhängen
      description: |
        Der gesamte Request-Body darf höchstens 96 KiB groß sein. Bei identischem
        eventId, sender und ciphertext wird die Operation idempotent mit Status 200
        und derselben eventId sowie revision beantwortet, unabhängig von
        expectedRevision. Wiederverwendung derselben eventId mit abweichendem
        sender oder ciphertext liefert event_conflict. expectedRevision dient
        ausschließlich der nebenläufigen Versionsprüfung; es schützt nicht gegen
        einen böswilligen Server. Die Ablaufzeit eines gespeicherten Datensatzes
        beträgt sieben Tage. Ein identischer Retry nach Ablauf liefert
        resync_required (410), solange der abgelaufene Datensatz noch vorhanden ist.
        Nach seiner Bereinigung ist die alte Ereignis-ID nicht mehr bekannt; ein
        Wiederholungsversuch kann dann wegen einer veralteten Revision mit 409
        abgewiesen werden. Die stündliche Bereinigung entfernt bis zu 1.000
        abgelaufene Datensätze pro Lauf; Provider-Backups können länger bestehen.
      security:
        - DevBearer: []
      x-max-request-size-bytes: 98304
      requestBody:
        required: true
        description: JSON-Objekt ohne unbekannte Eigenschaften; höchstens 96 KiB.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppendEventRequest'
      responses:
        '200':
          description: Identischer Request wurde bereits angenommen (idempotente Wiederholung).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppendEventResponse'
        '201':
          description: Ereignis angehängt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppendEventResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/ResyncRequired'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    DevBearer:
      type: http
      scheme: bearer
      bearerFormat: base64url-256-bit
      description: |
        43 Zeichen base64url ohne Padding, aus 256 zufälligen Bits. Nur für DEV-
        Testclients; serverseitig werden Credentials gehasht gespeichert. Token
        müssen aktiv und nicht abgelaufen sein sowie Geräte- und Gruppenzugriff
        besitzen. Widerrufene Tokens werden abgewiesen. Keine Tokens in Git oder Logs.
      x-token-pattern: '^[A-Za-z0-9_-]{43}$'
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [service, status, stage, protocolVersion]
      properties:
        service:
          const: squadtime-relay
        status:
          const: ok
        stage:
          const: dev
        protocolVersion:
          const: 1
    EventPage:
      type: object
      additionalProperties: false
      required: [events, nextAfter, headRevision, hasMore]
      properties:
        events:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/StoredEvent'
        nextAfter:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        headRevision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        hasMore:
          type: boolean
    StoredEvent:
      type: object
      additionalProperties: false
      required: [eventId, senderDeviceId, revision, ciphertext, createdAt, expiresAt]
      properties:
        eventId:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        senderDeviceId:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        revision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        ciphertext:
          type: string
          contentEncoding: base64
          maxLength: 65536
        createdAt:
          type: integer
          description: Unix-Zeitstempel in Sekunden.
          minimum: 0
          maximum: 9007199254740991
        expiresAt:
          type: integer
          description: Unix-Zeitstempel in Sekunden.
          minimum: 0
          maximum: 9007199254740991
    AppendEventRequest:
      type: object
      additionalProperties: false
      required: [eventId, expectedRevision, ciphertext]
      properties:
        eventId:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        expectedRevision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        ciphertext:
          type: string
          minLength: 4
          maxLength: 65536
          pattern: '^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$'
          contentEncoding: base64
          description: Kanonische Base64-Kodierung; Implementierungen müssen nach dem Dekodieren erneut kodieren und auf bytegenaue Gleichheit prüfen.
    AppendEventResponse:
      type: object
      additionalProperties: false
      required: [eventId, revision]
      properties:
        eventId:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        revision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - invalid_cursor
            - unauthorized
            - forbidden
            - not_found
            - method_not_allowed
            - revision_conflict
            - event_conflict
            - resync_required
            - payload_too_large
            - unsupported_media_type
            - internal_error
  responses:
    BadRequest:
      description: Ungültige Anfrage oder Cursor (invalid_request bzw. invalid_cursor).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidRequest:
              value:
                error: invalid_request
            invalidCursor:
              value:
                error: invalid_cursor
    Unauthorized:
      description: Bearer-Credential fehlt, ungültig, abgelaufen oder widerrufen.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unauthorized
    Forbidden:
      description: Kein Zugriff auf die Gruppe; unbekannte Gruppe und fehlende Mitgliedschaft sind nicht unterscheidbar.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: forbidden
    NotFound:
      description: Ressource oder Route nicht gefunden.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
    MethodNotAllowed:
      description: HTTP-Methode für diese Route nicht erlaubt.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: method_not_allowed
    Conflict:
      description: Versionskonflikt oder abweichende Wiederverwendung einer eventId.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            revisionConflict:
              value:
                error: revision_conflict
            eventConflict:
              value:
                error: event_conflict
    ResyncRequired:
      description: Angeforderte Historie oder ein wiederholtes POST für ein bereits abgelaufenes Ereignis erfordert eine Neusynchronisierung.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: resync_required
    PayloadTooLarge:
      description: Request überschreitet das Body-Limit von 96 KiB oder ein Nutzdatenlimit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: payload_too_large
    UnsupportedMediaType:
      description: Content-Type wird nicht unterstützt; erwartet wird application/json.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unsupported_media_type
    InternalError:
      description: Unerwarteter Fehler; Details werden nicht offengelegt.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal_error
