openapi: 3.1.0
info:
  title: Squadtime DEV Relay API
  version: 1.0.0
  description: |
    Contract for the development relay used by synthetic test clients. There is no
    public provisioning or production end-user onboarding. The relay stores opaque
    payloads; it does not validate MLS or whether a client has actually encrypted
    the content. Clients must implement encryption correctly.
servers:
  - url: https://relay.example.invalid
    description: Placeholder for the selected DEV environment
security: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Public health status
      security: []
      responses:
        '200':
          description: The relay is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                service: squadtime-relay
                status: ok
                stage: dev
                protocolVersion: 1
  /v1/groups/{groupId}/events:
    parameters:
      - name: groupId
        in: path
        required: true
        description: Opaque group identifier; contains no plaintext data.
        schema:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    get:
      operationId: listGroupEvents
      summary: List events for a group
      description: |
        Returns at most 100 events per page. `after` is an exclusive cursor over
        server-side ordering. Expired history may require a resync. Events can be
        retrieved through the API for up to seven days. Hourly cleanup removes up to
        1,000 expired records per run; provider backups may persist longer.
      security:
        - DevBearer: []
      parameters:
        - name: after
          in: query
          required: false
          description: Exclusive cursor, safe integer greater than or equal to 0; defaults to 0.
          schema:
            type: integer
            minimum: 0
            maximum: 9007199254740991
            default: 0
      responses:
        '200':
          description: Event page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '410':
          $ref: '#/components/responses/ResyncRequired'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: appendGroupEvent
      summary: Append a group event
      description: |
        The complete request body must not exceed 96 KiB. If `eventId`, sender and
        ciphertext are identical, the operation is idempotent and returns status
        200 with the same `eventId` and `revision`, regardless of `expectedRevision`.
        Reusing an `eventId` with a different sender or ciphertext returns
        `event_conflict`. `expectedRevision` is used only for concurrent version
        checks; it does not protect against a malicious server. A stored record
        expires after seven days. An identical retry after expiry returns
        `resync_required` (410) while the expired record still exists. After cleanup,
        the old event ID is no longer known; a retry may then be rejected with 409
        because its revision is stale. Hourly cleanup removes up to 1,000 expired
        records per run; provider backups may persist longer.
      security:
        - DevBearer: []
      x-max-request-size-bytes: 98304
      requestBody:
        required: true
        description: JSON object with no unknown properties; maximum size 96 KiB.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppendEventRequest'
      responses:
        '200':
          description: An identical request was already accepted (idempotent retry).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppendEventResponse'
        '201':
          description: Event appended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppendEventResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/ResyncRequired'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    DevBearer:
      type: http
      scheme: bearer
      bearerFormat: base64url-256-bit
      description: |
        43-character base64url token without padding, generated from 256 random bits.
        For DEV test clients only; credentials are stored as hashes on the server.
        Tokens must be active and unexpired, and have device and group access. Revoked
        tokens are rejected. Never put tokens in Git or logs.
      x-token-pattern: '^[A-Za-z0-9_-]{43}$'
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [service, status, stage, protocolVersion]
      properties:
        service:
          const: squadtime-relay
        status:
          const: ok
        stage:
          const: dev
        protocolVersion:
          const: 1
    EventPage:
      type: object
      additionalProperties: false
      required: [events, nextAfter, headRevision, hasMore]
      properties:
        events:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/StoredEvent'
        nextAfter:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        headRevision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        hasMore:
          type: boolean
    StoredEvent:
      type: object
      additionalProperties: false
      required: [eventId, senderDeviceId, revision, ciphertext, createdAt, expiresAt]
      properties:
        eventId:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        senderDeviceId:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        revision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        ciphertext:
          type: string
          contentEncoding: base64
          maxLength: 65536
        createdAt:
          type: integer
          description: Unix timestamp in seconds.
          minimum: 0
          maximum: 9007199254740991
        expiresAt:
          type: integer
          description: Unix timestamp in seconds.
          minimum: 0
          maximum: 9007199254740991
    AppendEventRequest:
      type: object
      additionalProperties: false
      required: [eventId, expectedRevision, ciphertext]
      properties:
        eventId:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        expectedRevision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        ciphertext:
          type: string
          minLength: 4
          maxLength: 65536
          pattern: '^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$'
          contentEncoding: base64
          description: Canonical Base64 encoding; implementations must re-encode after decoding and verify byte-for-byte equality.
    AppendEventResponse:
      type: object
      additionalProperties: false
      required: [eventId, revision]
      properties:
        eventId:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        revision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - invalid_cursor
            - unauthorized
            - forbidden
            - not_found
            - method_not_allowed
            - revision_conflict
            - event_conflict
            - resync_required
            - payload_too_large
            - unsupported_media_type
            - internal_error
  responses:
    BadRequest:
      description: Invalid request or cursor (`invalid_request` or `invalid_cursor`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidRequest:
              value:
                error: invalid_request
            invalidCursor:
              value:
                error: invalid_cursor
    Unauthorized:
      description: Bearer credential is missing, invalid, expired or revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unauthorized
    Forbidden:
      description: No access to the group; an unknown group and missing membership are indistinguishable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: forbidden
    NotFound:
      description: Resource or route not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
    MethodNotAllowed:
      description: HTTP method is not allowed for this route.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: method_not_allowed
    Conflict:
      description: Revision conflict or reuse of an event ID with different content.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            revisionConflict:
              value:
                error: revision_conflict
            eventConflict:
              value:
                error: event_conflict
    ResyncRequired:
      description: Requested history or a retry of an expired event requires resynchronization.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: resync_required
    PayloadTooLarge:
      description: Request exceeds the 96 KiB body limit or a payload limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: payload_too_large
    UnsupportedMediaType:
      description: Content-Type is not supported; expected `application/json`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unsupported_media_type
    InternalError:
      description: Unexpected error; details are not disclosed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal_error
