# Retain every default detector. This exception is limited to one audited public
# MLS KeyPackage in the synthetic admission vector (including nested envelopes).
# It contains public signing/HPKE keys and signatures, not private state.
[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Exact public MLS KeyPackage from the synthetic native admission fixture"
condition = "AND"
paths = ['''^native/fixtures/admission-v1\.json$''']
regexTarget = "secret"
