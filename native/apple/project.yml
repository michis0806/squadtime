name: SquadtimeAppleProof
options:
  bundleIdPrefix: dev.squadtime.proof
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: '-'
    CODE_SIGN_STYLE: Manual
    TARGETED_DEVICE_FAMILY: '1,2'
    SWIFT_INCLUDE_PATHS: '$(SRCROOT)/RustMLS'
    LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]: '$(SRCROOT)/../../.local/native/apple/iphonesimulator'
    LIBRARY_SEARCH_PATHS[sdk=iphoneos*]: '$(SRCROOT)/../../.local/native/apple/iphoneos'
    OTHER_LDFLAGS: '$(inherited) -lsquadtime_mls_spike -lsqlite3'
targets:
  PairingProof:
    type: framework
    platform: iOS
    sources: [Sources/PairingProof]
    preBuildScripts:
      - name: Check native Rust MLS archive
        path: scripts/check-rust-bridge.sh
        basedOnDependencyAnalysis: false
  SquadtimePrototype:
    type: application
    platform: iOS
    sources: [Prototype]
    dependencies:
      - target: PairingProof
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.squadtime.prototype
        INFOPLIST_KEY_CFBundleDisplayName: Squadtime DEV
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Scan the other test device pairing code.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
    info:
      path: build/Prototype-Info.plist
      properties:
        NSLocalNetworkUsageDescription: Connect to the explicitly selected local synthetic test relay.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
  PrototypeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PrototypeUITests]
    dependencies:
      - target: SquadtimePrototype
  PrototypeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PrototypeTests]
    dependencies:
      - target: SquadtimePrototype
    settings:
      base:
        TEST_HOST: '$(BUILT_PRODUCTS_DIR)/SquadtimePrototype.app/SquadtimePrototype'
        BUNDLE_LOADER: '$(TEST_HOST)'
  ProofHost:
    type: application
    platform: iOS
    sources: [TestHost]
    info:
      path: build/ProofHost-Info.plist
      properties:
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.squadtime.proof.host
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    entitlements:
      path: TestHost/ProofHost.entitlements
      properties:
        application-identifier: dev.squadtime.proof.host
        keychain-access-groups:
          - dev.squadtime.proof.host
  PairingProofTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: ../fixtures/pairing-v1.json
        buildPhase: resources
    dependencies:
      - target: PairingProof
      - target: ProofHost
    settings:
      base:
        TEST_HOST: '$(BUILT_PRODUCTS_DIR)/ProofHost.app/ProofHost'
        BUNDLE_LOADER: '$(TEST_HOST)'
  VaultRestartProofTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RestartTests]
    dependencies:
      - target: PairingProof
      - target: ProofHost
    settings:
      base:
        TEST_HOST: '$(BUILT_PRODUCTS_DIR)/ProofHost.app/ProofHost'
        BUNDLE_LOADER: '$(TEST_HOST)'
  AdmissionExchangeProofTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ExchangeTests]
    dependencies:
      - target: PairingProof
      - target: ProofHost
    settings:
      base:
        TEST_HOST: '$(BUILT_PRODUCTS_DIR)/ProofHost.app/ProofHost'
        BUNDLE_LOADER: '$(TEST_HOST)'
schemes:
  SquadtimePrototype:
    build:
      targets:
        SquadtimePrototype: all
    test:
      targets: [PrototypeTests]
  PrototypeUI:
    build:
      targets:
        SquadtimePrototype: all
    test:
      targets: [PrototypeUITests]
  PairingProof:
    build:
      targets:
        PairingProof: all
        ProofHost: all
    test:
      targets: [PairingProofTests]
  VaultRestartProof:
    build:
      targets:
        PairingProof: all
        ProofHost: all
    test:
      targets: [VaultRestartProofTests]
  AdmissionExchangeProof:
    build:
      targets:
        PairingProof: all
        ProofHost: all
    test:
      targets: [AdmissionExchangeProofTests]
