name: SquadtimeAppleProof
options:
  bundleIdPrefix: dev.squadtime.proof
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: '-'
    CODE_SIGN_STYLE: Manual
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  PairingProof:
    type: framework
    platform: iOS
    sources: [Sources/PairingProof]
  ProofHost:
    type: application
    platform: iOS
    sources: [TestHost]
    info:
      path: build/ProofHost-Info.plist
      properties:
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.squadtime.proof.host
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    entitlements:
      path: TestHost/ProofHost.entitlements
      properties:
        application-identifier: dev.squadtime.proof.host
        keychain-access-groups:
          - dev.squadtime.proof.host
  PairingProofTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: ../fixtures/pairing-v1.json
        buildPhase: resources
    dependencies:
      - target: PairingProof
      - target: ProofHost
    settings:
      base:
        TEST_HOST: '$(BUILT_PRODUCTS_DIR)/ProofHost.app/ProofHost'
        BUNDLE_LOADER: '$(TEST_HOST)'
schemes:
  PairingProof:
    build:
      targets:
        PairingProof: all
        ProofHost: all
    test:
      targets: [PairingProofTests]
